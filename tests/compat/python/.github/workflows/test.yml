name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install "pytest>=8,<10"
      - run: python -m pytest -q
      - run: python scripts/sync_distribution.py --check
      - run: python scripts/sync_guidance.py --check
      - run: python -m compileall -q plugins tests
